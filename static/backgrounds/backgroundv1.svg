<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1014"/>
      <stop offset="100%" stop-color="#0d1418"/>
    </linearGradient>

    <linearGradient id="ambient1" x1="220" y1="120" x2="620" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172229" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#131c21" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ambient2" x1="1080" y1="560" x2="1520" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172229" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#131c21" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="branch" x1="140" y1="130" x2="1440" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8f2f1" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#66e3b4" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#e8f2f1" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="branchSoft" x1="140" y1="130" x2="1440" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8f2f1" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#66e3b4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8f2f1" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66e3b4" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#66e3b4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#66e3b4" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <mask id="softFade">
      <rect width="1600" height="900" fill="white"/>
      <rect width="1600" height="900" fill="url(#maskGrad)"/>
    </mask>

    <radialGradient id="maskGrad" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="68%" stop-color="white" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.20"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

